<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>LUX METER</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b0d10; color: #e8eaed;
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
  }
  #mode { font-size: 13px; letter-spacing: 1px; color: #8b949e; }
  #val {
    font-size: 26vw; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; color: #ffd54a;
  }
  @media (min-width: 600px) { #val { font-size: 150px; } }
  #unit { font-size: 22px; color: #8b949e; }
  #desc { font-size: 18px; min-height: 24px; }
  #barWrap {
    width: 100%; max-width: 420px; height: 12px;
    background: #1c2128; border-radius: 6px; overflow: hidden;
  }
  #bar { height: 100%; width: 0%; background: linear-gradient(90deg, #3a4a6b, #ffd54a, #fff); transition: width .15s; }
  #stats { font-size: 14px; color: #8b949e; font-variant-numeric: tabular-nums; }
  button {
    font-size: 17px; padding: 12px 28px; border: 0; border-radius: 8px;
    background: #ffd54a; color: #111; font-weight: 600;
  }
  button.sub { background: #1c2128; color: #e8eaed; font-size: 14px; padding: 9px 18px; }
  #msg { font-size: 13px; color: #f28b82; max-width: 420px; line-height: 1.5; white-space: pre-line; }
  video, canvas { display: none; }
</style>
</head>
<body>
  <div id="mode">대기 중</div>
  <div id="val">--</div>
  <div id="unit">lux</div>
  <div id="desc"></div>
  <div id="barWrap"><div id="bar"></div></div>
  <div id="stats">MIN -- / MAX --</div>
  <button id="start">시작</button>
  <button id="reset" class="sub" hidden>MIN/MAX 초기화</button>
  <div id="msg"></div>

  <video id="v" playsinline muted></video>
  <canvas id="c" width="32" height="24"></canvas>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var elMode = $('mode'), elVal = $('val'), elUnit = $('unit'), elDesc = $('desc'),
      elBar = $('bar'), elStats = $('stats'), elMsg = $('msg'),
      btnStart = $('start'), btnReset = $('reset');

  var min = Infinity, max = -Infinity, isLux = true;

  function describe(lux) {
    if (lux < 1) return '암흑';
    if (lux < 50) return '매우 어두움';
    if (lux < 200) return '어두운 실내';
    if (lux < 500) return '일반 실내';
    if (lux < 1000) return '밝은 실내';
    if (lux < 10000) return '흐린 날 야외';
    if (lux < 30000) return '맑은 날 그늘';
    return '직사광선';
  }

  function show(v) {
    if (v < min) min = v;
    if (v > max) max = v;
    var r = Math.round(v);
    elVal.textContent = r;
    elStats.textContent = 'MIN ' + Math.round(min) + ' / MAX ' + Math.round(max);
    if (isLux) {
      // 로그 스케일: 1 ~ 100000 lux
      var p = Math.log10(Math.max(v, 1)) / 5 * 100;
      elBar.style.width = Math.min(100, Math.max(0, p)) + '%';
      elDesc.textContent = describe(v);
    } else {
      elBar.style.width = Math.min(100, Math.max(0, v)) + '%';
      elDesc.textContent = '';
    }
  }

  function note(t) { elMsg.textContent = t; }

  // 1) 조도 센서
  function startSensor() {
    return new Promise(function (resolve, reject) {
      if (!('AmbientLightSensor' in window)) return reject(new Error('AmbientLightSensor 미지원'));
      var s, got = false;
      try { s = new AmbientLightSensor({ frequency: 10 }); }
      catch (e) { return reject(e); }
      s.onreading = function () {
        if (!got) {
          got = true;
          isLux = true;
          elMode.textContent = '조도 센서 (실측)';
          elUnit.textContent = 'lux';
          resolve();
        }
        show(s.illuminance);
      };
      s.onerror = function (e) {
        if (!got) reject(e.error || new Error('센서 오류'));
        else note('센서 오류: ' + (e.error && e.error.message));
      };
      s.start();
      // 일정 시간 내 값이 안 오면 실패 처리
      setTimeout(function () {
        if (!got) { try { s.stop(); } catch (_) {} reject(new Error('센서 응답 없음')); }
      }, 2000);
    });
  }

  // 2) 카메라 폴백 (상대 밝기)
  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      return Promise.reject(new Error('카메라 API 미지원'));
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 160 }, height: { ideal: 120 } },
      audio: false
    }).then(function (stream) {
      var v = $('v'), c = $('c'), ctx = c.getContext('2d', { willReadFrequently: true });
      v.srcObject = stream;
      return v.play().then(function () {
        isLux = false;
        min = Infinity; max = -Infinity;
        elMode.textContent = '카메라 추정 (상대값)';
        elUnit.textContent = '%';
        function tick() {
          ctx.drawImage(v, 0, 0, c.width, c.height);
          var d = ctx.getImageData(0, 0, c.width, c.height).data, sum = 0;
          for (var i = 0; i < d.length; i += 4)
            sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
          show(sum / (d.length / 4) / 255 * 100);
          setTimeout(tick, 100);
        }
        tick();
      });
    });
  }

  btnStart.onclick = function () {
    btnStart.hidden = true;
    note('');
    if (!window.isSecureContext) {
      note('HTTPS(또는 localhost)에서 열어야 동작함.');
      btnStart.hidden = false;
      return;
    }
    startSensor().catch(function (e1) {
      note('조도 센서 사용 불가: ' + e1.message +
           '\nchrome://flags/#enable-generic-sensor-extra-classes 를 Enabled 로 바꾸면 실측 lux 표시됨.' +
           '\n카메라 추정으로 전환함.');
      return startCamera();
    }).then(function () {
      btnReset.hidden = false;
    }).catch(function (e2) {
      note(elMsg.textContent + '\n카메라도 실패: ' + e2.message);
      elMode.textContent = '측정 불가';
      btnStart.hidden = false;
    });
  };

  btnReset.onclick = function () {
    min = Infinity; max = -Infinity;
    elStats.textContent = 'MIN -- / MAX --';
  };
})();
</script>
</body>
</html>
