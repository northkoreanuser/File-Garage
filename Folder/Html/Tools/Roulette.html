<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>랜덤 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --stage: #0B0C10;
    --panel: #16171F;
    --panel-2: #1C1E29;
    --line: #2A2C3A;
    --text: #F4F2F8;
    --muted: #8D8AA0;
    --accent: #7C5CFF;
    --accent-2: #FF4D8D;
    --accent-3: #38D9D9;
    --radius-lg: 18px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--stage);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    height: 100%;
  }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
  }

  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 10px 2px rgba(255,77,141,0.7);
  }

  .topbar-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn, .text-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .icon-btn:hover, .text-btn:hover {
    border-color: var(--accent);
  }

  .icon-btn[aria-pressed="true"] {
    color: var(--muted);
  }

  .text-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 4px 6px;
    font-size: 13px;
  }
  .text-btn:hover { color: var(--accent-2); border: none; }

  /* ---------- Layout ---------- */
  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: 1.35fr 420px;
    gap: 0;
    min-height: 0;
  }

  @media (max-width: 920px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---------- Stage / Wheel ---------- */
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 56px;
    background:
      radial-gradient(circle at 50% 38%, rgba(124,92,255,0.22), transparent 58%),
      radial-gradient(circle at 50% 38%, rgba(255,77,141,0.10), transparent 70%);
    border-right: 1px solid var(--line);
    overflow: hidden;
  }

  @media (max-width: 920px) {
    .stage { border-right: none; border-bottom: 1px solid var(--line); padding: 32px 16px 44px; }
  }

  .wheel-wrap {
    position: relative;
    width: min(92vw, 520px);
    aspect-ratio: 1 / 1;
    animation: enter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes enter {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .wheel-wrap { animation: none; }
  }

  #wheelCanvas {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,0.55));
  }

  #confettiCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 40;
  }

  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 26px solid var(--accent-2);
    filter: drop-shadow(0 0 8px rgba(255,77,141,0.8));
    z-index: 5;
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 22%;
    height: 22%;
    min-width: 84px;
    min-height: 84px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #9b7dff, var(--accent) 55%, #5b3fd6 100%);
    color: #fff;
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(15px, 2.4vw, 20px);
    letter-spacing: 1px;
    box-shadow: 0 0 0 6px rgba(11,12,16,0.9), 0 0 28px 4px rgba(124,92,255,0.65);
    animation: pulse 2.2s ease-in-out infinite;
    z-index: 6;
  }

  .hub:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    animation: none;
  }

  .hub:focus-visible {
    outline: 3px solid var(--accent-3);
    outline-offset: 4px;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 6px rgba(11,12,16,0.9), 0 0 22px 2px rgba(124,92,255,0.55); }
    50% { box-shadow: 0 0 0 6px rgba(11,12,16,0.9), 0 0 36px 8px rgba(124,92,255,0.85); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hub { animation: none; }
  }

  .hint {
    margin-top: 22px;
    color: var(--muted);
    font-size: 13px;
    min-height: 18px;
  }

  /* ---------- Result banner ---------- */
  .result-banner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    background: rgba(20, 21, 30, 0.92);
    backdrop-filter: blur(6px);
    border: 1px solid var(--accent-2);
    border-radius: var(--radius-lg);
    padding: 28px 36px;
    text-align: center;
    min-width: 260px;
    box-shadow: 0 0 0 1px rgba(255,77,141,0.15), 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(255,77,141,0.35);
    animation: pop 0.35s cubic-bezier(0.2, 0.9, 0.25, 1.2) both;
  }

  @keyframes pop {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .result-eyebrow {
    margin: 0 0 6px;
    color: var(--accent-2);
    font-size: 14px;
    font-weight: 700;
  }

  .result-name {
    margin: 0 0 20px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(28px, 6vw, 40px);
    line-height: 1.15;
    word-break: keep-all;
  }

  .result-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .btn {
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }
  .btn-primary:hover { filter: brightness(1.08); }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
  }
  .btn-ghost:hover { border-color: var(--text); }

  /* ---------- Panel ---------- */
  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-height: 100vh;
  }

  .panel-section {
    padding: 22px 24px;
    border-bottom: 1px solid var(--line);
  }

  .panel-section.grow {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 220px;
  }

  .panel-section h2 {
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .panel-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .panel-section-head h2 { margin: 0; }

  .count-pill {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
  }

  .add-form {
    display: flex;
    gap: 8px;
  }

  .add-form input {
    flex: 1;
    min-width: 0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
  }

  .add-form input:focus-visible {
    outline: none;
    border-color: var(--accent);
  }

  .item-list {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .item-row {
    display: grid;
    grid-template-columns: 14px 1fr auto auto auto;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
  }

  .item-color {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .item-name {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    min-width: 0;
    width: 100%;
  }
  .item-name:focus-visible { outline: none; }

  .item-pct {
    color: var(--muted);
    font-size: 12px;
    min-width: 34px;
    text-align: right;
  }

  .weight-stepper {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
  }

  .weight-btn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .weight-btn:hover { color: var(--accent-3); }

  .weight-value {
    font-size: 12px;
    min-width: 14px;
    text-align: center;
    color: var(--text);
  }

  .item-delete {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
  }
  .item-delete:hover { color: var(--accent-2); }

  .item-empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 24px 0;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }

  .toggle-row input { accent-color: var(--accent-2); }

  .history-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 180px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .history-list li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    padding: 7px 10px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }

  .history-time { color: var(--muted); }

  .history-empty {
    color: var(--muted);
    justify-content: center !important;
    background: transparent !important;
    border: 1px dashed var(--line) !important;
  }

  .item-list::-webkit-scrollbar,
  .history-list::-webkit-scrollbar { width: 6px; }
  .item-list::-webkit-scrollbar-thumb,
  .history-list::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 999px;
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>랜덤 룰렛</div>
    <div class="topbar-actions">
      <button id="muteBtn" class="icon-btn" aria-pressed="false" title="효과음 켜기/끄기">🔊 효과음</button>
      <button id="resetBtn" class="icon-btn" title="기본 목록으로 초기화">초기화</button>
    </div>
  </header>

  <main class="layout">

    <section class="stage" aria-label="룰렛 화면">
      <div class="wheel-wrap" id="wheelWrap">
        <div class="pointer"></div>
        <canvas id="wheelCanvas"></canvas>
        <button id="hubBtn" class="hub" aria-label="룰렛 돌리기">SPIN</button>

        <div id="resultBanner" class="result-banner" hidden>
          <p class="result-eyebrow">당첨</p>
          <p id="resultName" class="result-name" aria-live="polite"></p>
          <div class="result-actions">
            <button id="spinAgainBtn" class="btn btn-primary">다시 돌리기</button>
            <button id="closeBannerBtn" class="btn btn-ghost">닫기</button>
          </div>
        </div>
      </div>
      <p class="hint" id="hint"></p>
    </section>

    <aside class="panel">
      <div class="panel-section">
        <h2>항목 추가</h2>
        <form id="addForm" class="add-form">
          <input id="addInput" type="text" placeholder="예: 마라탕" maxlength="20" autocomplete="off" required />
          <button type="submit" class="btn btn-primary">추가</button>
        </form>
      </div>

      <div class="panel-section grow">
        <div class="panel-section-head">
          <h2>항목 목록</h2>
          <span class="count-pill" id="itemCount">0개</span>
        </div>
        <ul id="itemList" class="item-list"></ul>
        <label class="toggle-row">
          <input type="checkbox" id="removeAfterWin" />
          <span>당첨 후 목록에서 제거 (추첨 모드)</span>
        </label>
      </div>

      <div class="panel-section" style="border-bottom:none;">
        <div class="panel-section-head">
          <h2>스핀 기록</h2>
          <button id="clearHistoryBtn" class="text-btn">지우기</button>
        </div>
        <ol id="historyList" class="history-list">
          <li class="history-empty">아직 기록이 없어요</li>
        </ol>
      </div>
    </aside>

  </main>
</div>

<canvas id="confettiCanvas"></canvas>

<script>
(function(){
  "use strict";

  // ---------- Palette & default data ----------
  var PALETTE = ["#7C5CFF", "#FF4D8D", "#38D9D9", "#FFB84D", "#5CE694", "#5C8DFF", "#FF6B5C", "#C792FF"];
  var DEFAULT_NAMES = ["치킨", "피자", "마라탕", "돈까스", "초밥", "라멘", "보쌈", "떡볶이"];

  var colorCursor = 0;
  var idCursor = 0;

  function makeItem(text){
    var item = { id: "i" + (idCursor++), text: text, weight: 1, color: PALETTE[colorCursor % PALETTE.length] };
    colorCursor++;
    return item;
  }

  function defaultItems(){
    colorCursor = 0;
    return DEFAULT_NAMES.map(makeItem);
  }

  var items = defaultItems();
  var removeAfterWin = false;
  var history = [];
  var muted = false;
  var spinning = false;
  var rotationDeg = 0; // accumulated rotation
  var pendingRemovalId = null;

  // ---------- DOM refs ----------
  var wheelWrap = document.getElementById("wheelWrap");
  var canvas = document.getElementById("wheelCanvas");
  var ctx = canvas.getContext("2d");
  var confettiCanvas = document.getElementById("confettiCanvas");
  var cctx = confettiCanvas.getContext("2d");
  var hubBtn = document.getElementById("hubBtn");
  var hint = document.getElementById("hint");
  var resultBanner = document.getElementById("resultBanner");
  var resultName = document.getElementById("resultName");
  var spinAgainBtn = document.getElementById("spinAgainBtn");
  var closeBannerBtn = document.getElementById("closeBannerBtn");
  var addForm = document.getElementById("addForm");
  var addInput = document.getElementById("addInput");
  var itemList = document.getElementById("itemList");
  var itemCount = document.getElementById("itemCount");
  var removeAfterWinCheckbox = document.getElementById("removeAfterWin");
  var historyList = document.getElementById("historyList");
  var clearHistoryBtn = document.getElementById("clearHistoryBtn");
  var muteBtn = document.getElementById("muteBtn");
  var resetBtn = document.getElementById("resetBtn");

  // ---------- Canvas sizing ----------
  var wheelSize = 520;
  function resizeCanvas(){
    var dpr = window.devicePixelRatio || 1;
    var w = wheelWrap.clientWidth;
    wheelSize = w;
    canvas.width = w * dpr;
    canvas.height = w * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = w + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawWheel();

    confettiCanvas.width = window.innerWidth * dpr;
    confettiCanvas.height = window.innerHeight * dpr;
    confettiCanvas.style.width = window.innerWidth + "px";
    confettiCanvas.style.height = window.innerHeight + "px";
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resizeCanvas);

  // ---------- Wheel drawing ----------
  function totalWeight(){
    return items.reduce(function(s, i){ return s + i.weight; }, 0);
  }

  function segments(){
    var total = totalWeight();
    var acc = 0;
    return items.map(function(it){
      var start = (acc / total) * 360;
      acc += it.weight;
      var end = (acc / total) * 360;
      return { item: it, start: start, end: end };
    });
  }

  function luminance(hex){
    var r = parseInt(hex.substr(1,2),16) / 255;
    var g = parseInt(hex.substr(3,2),16) / 255;
    var b = parseInt(hex.substr(5,2),16) / 255;
    return 0.2126*r + 0.7152*g + 0.0722*b;
  }

  function drawWheel(){
    var size = wheelSize;
    var cx = size/2, cy = size/2;
    var radius = size/2 - 6;
    ctx.clearRect(0,0,size,size);

    if (items.length === 0){
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI*2);
      ctx.fillStyle = "#1C1E29";
      ctx.fill();
      ctx.restore();
      return;
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotationDeg * Math.PI/180);

    var segs = segments();
    segs.forEach(function(seg){
      var a0 = seg.start * Math.PI/180;
      var a1 = seg.end * Math.PI/180;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0, radius, a0, a1);
      ctx.closePath();
      ctx.fillStyle = seg.item.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#0B0C10";
      ctx.stroke();
    });

    // labels
    segs.forEach(function(seg){
      var mid = (seg.start + seg.end) / 2 * Math.PI/180;
      var span = seg.end - seg.start;
      var fontSize = Math.max(11, Math.min(18, size/26));
      if (span < 14) fontSize = Math.max(9, fontSize - 4);
      ctx.save();
      ctx.rotate(mid);
      ctx.fillStyle = luminance(seg.item.color) > 0.6 ? "#15161d" : "#ffffff";
      ctx.font = "700 " + fontSize + "px 'Noto Sans KR', sans-serif";
      ctx.textBaseline = "middle";
      var label = seg.item.text.length > 10 ? seg.item.text.slice(0,9) + "…" : seg.item.text;
      var upsideDown = Math.cos(mid) < 0;
      if (upsideDown){
        ctx.textAlign = "left";
        ctx.translate(-(radius - 18), 0);
        ctx.rotate(Math.PI);
      } else {
        ctx.textAlign = "right";
        ctx.translate(radius - 18, 0);
      }
      ctx.fillText(label, 0, 0);
      ctx.restore();
    });

    // outer rim
    ctx.beginPath();
    ctx.arc(0,0, radius, 0, Math.PI*2);
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#7C5CFF";
    ctx.stroke();

    // hub backdrop
    ctx.beginPath();
    ctx.arc(0,0, radius*0.135, 0, Math.PI*2);
    ctx.fillStyle = "#16171F";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#FF4D8D";
    ctx.stroke();

    ctx.restore();
  }

  // ---------- Item list rendering ----------
  function renderItems(){
    itemList.innerHTML = "";
    itemCount.textContent = items.length + "개";

    if (items.length === 0){
      var empty = document.createElement("li");
      empty.className = "item-empty";
      empty.textContent = "항목을 추가해 주세요";
      itemList.appendChild(empty);
    }

    var total = totalWeight();

    items.forEach(function(it){
      var li = document.createElement("li");
      li.className = "item-row";
      li.dataset.id = it.id;

      var dot = document.createElement("span");
      dot.className = "item-color";
      dot.style.background = it.color;

      var nameInput = document.createElement("input");
      nameInput.className = "item-name";
      nameInput.value = it.text;
      nameInput.maxLength = 20;
      nameInput.setAttribute("aria-label", "항목 이름");
      nameInput.addEventListener("input", function(){
        it.text = nameInput.value || "무제";
        drawWheel();
      });

      var pct = document.createElement("span");
      pct.className = "item-pct";
      pct.textContent = total > 0 ? Math.round((it.weight/total)*100) + "%" : "0%";

      var stepper = document.createElement("div");
      stepper.className = "weight-stepper";

      var minusBtn = document.createElement("button");
      minusBtn.className = "weight-btn";
      minusBtn.type = "button";
      minusBtn.textContent = "−";
      minusBtn.setAttribute("aria-label", "가중치 감소");
      minusBtn.addEventListener("click", function(){
        it.weight = Math.max(1, it.weight - 1);
        renderItems();
        drawWheel();
      });

      var valSpan = document.createElement("span");
      valSpan.className = "weight-value";
      valSpan.textContent = it.weight;

      var plusBtn = document.createElement("button");
      plusBtn.className = "weight-btn";
      plusBtn.type = "button";
      plusBtn.textContent = "+";
      plusBtn.setAttribute("aria-label", "가중치 증가");
      plusBtn.addEventListener("click", function(){
        it.weight = Math.min(20, it.weight + 1);
        renderItems();
        drawWheel();
      });

      stepper.appendChild(minusBtn);
      stepper.appendChild(valSpan);
      stepper.appendChild(plusBtn);

      var delBtn = document.createElement("button");
      delBtn.className = "item-delete";
      delBtn.type = "button";
      delBtn.textContent = "✕";
      delBtn.setAttribute("aria-label", "삭제");
      delBtn.addEventListener("click", function(){
        items = items.filter(function(x){ return x.id !== it.id; });
        renderItems();
        drawWheel();
        updateHint();
      });

      li.appendChild(dot);
      li.appendChild(nameInput);
      li.appendChild(pct);
      li.appendChild(stepper);
      li.appendChild(delBtn);
      itemList.appendChild(li);
    });
  }

  function updateHint(){
    if (items.length < 2){
      hint.textContent = "항목을 2개 이상 추가하면 룰렛을 돌릴 수 있어요";
      hubBtn.disabled = true;
    } else if (!spinning) {
      hint.textContent = "휠 가운데를 눌러 돌려보세요";
      hubBtn.disabled = false;
    }
  }

  // ---------- History ----------
  function renderHistory(){
    historyList.innerHTML = "";
    if (history.length === 0){
      var empty = document.createElement("li");
      empty.className = "history-empty";
      empty.textContent = "아직 기록이 없어요";
      historyList.appendChild(empty);
      return;
    }
    history.forEach(function(h){
      var li = document.createElement("li");
      var name = document.createElement("span");
      name.textContent = h.text;
      var time = document.createElement("span");
      time.className = "history-time";
      time.textContent = h.time;
      li.appendChild(name);
      li.appendChild(time);
      historyList.appendChild(li);
    });
  }

  // ---------- Audio ----------
  var audioCtx = null;
  function ensureAudio(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function playTick(){
    if (muted) return;
    ensureAudio();
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = 950;
    gain.gain.setValueAtTime(0.07, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.06);
  }

  function playWinChime(){
    if (muted) return;
    ensureAudio();
    var notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach(function(f, i){
      var t = audioCtx.currentTime + i * 0.11;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.13, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.4);
    });
  }

  // ---------- Confetti ----------
  var confettiParticles = [];
  var confettiRunning = false;

  function spawnConfetti(){
    var rect = wheelWrap.getBoundingClientRect();
    var originX = rect.left + rect.width/2;
    var originY = rect.top + rect.height*0.35;
    var count = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 30 : 110;
    for (var i=0; i<count; i++){
      var angle = Math.random()*Math.PI*2;
      var speed = 2 + Math.random()*6;
      confettiParticles.push({
        x: originX, y: originY,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed - 3,
        size: 4 + Math.random()*5,
        color: PALETTE[Math.floor(Math.random()*PALETTE.length)],
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.3,
        life: 0,
        maxLife: 70 + Math.random()*40
      });
    }
    if (!confettiRunning){
      confettiRunning = true;
      requestAnimationFrame(stepConfetti);
    }
  }

  function stepConfetti(){
    cctx.clearRect(0,0,window.innerWidth, window.innerHeight);
    var alive = [];
    confettiParticles.forEach(function(p){
      p.vy += 0.12;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life++;
      if (p.life < p.maxLife){
        alive.push(p);
        var alpha = 1 - p.life/p.maxLife;
        cctx.save();
        cctx.translate(p.x, p.y);
        cctx.rotate(p.rot);
        cctx.globalAlpha = Math.max(alpha, 0);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
        cctx.restore();
      }
    });
    confettiParticles = alive;
    if (confettiParticles.length > 0){
      requestAnimationFrame(stepConfetti);
    } else {
      confettiRunning = false;
      cctx.clearRect(0,0,window.innerWidth, window.innerHeight);
    }
  }

  // ---------- Spin logic ----------
  function pickWinnerIndex(){
    var total = totalWeight();
    var r = Math.random()*total;
    for (var i=0;i<items.length;i++){
      r -= items[i].weight;
      if (r <= 0) return i;
    }
    return items.length-1;
  }

  function easeOutQuint(t){ return 1 - Math.pow(1-t, 5); }

  function angleToSegmentIndex(angleDeg){
    var segs = segments();
    for (var i=0;i<segs.length;i++){
      if (angleDeg >= segs[i].start && angleDeg < segs[i].end) return i;
    }
    return segs.length - 1;
  }

  function spin(){
    if (spinning || items.length < 2) return;
    ensureAudio();
    spinning = true;
    hubBtn.disabled = true;
    hubBtn.textContent = "...";
    hint.textContent = "돌아가는 중...";
    hideBanner(true);

    var winnerIdx = pickWinnerIndex();
    var segs = segments();
    var seg = segs[winnerIdx];
    var span = seg.end - seg.start;
    var pad = Math.min(span*0.3, 4);
    var targetLocalAngle = seg.start + pad + Math.random()*Math.max(span - pad*2, 0.001);

    var pointerAngle = 270; // top of wheel, in canvas-degree terms
    var targetMod = ((pointerAngle - targetLocalAngle) % 360 + 360) % 360;
    var currentMod = ((rotationDeg % 360) + 360) % 360;
    var diff = ((targetMod - currentMod) % 360 + 360) % 360;
    var extraSpins = (6 + Math.floor(Math.random()*3)) * 360;
    var startRotation = rotationDeg;
    var endRotation = rotationDeg + extraSpins + diff;
    var duration = 5000 + Math.random()*700;
    var startTime = null;
    var lastSegIdx = angleToSegmentIndex(((pointerAngle - startRotation) % 360 + 360) % 360);

    function frame(ts){
      if (startTime === null) startTime = ts;
      var t = Math.min((ts - startTime) / duration, 1);
      var eased = easeOutQuint(t);
      rotationDeg = startRotation + (endRotation - startRotation) * eased;
      drawWheel();

      var localAngle = ((pointerAngle - rotationDeg) % 360 + 360) % 360;
      var segIdx = angleToSegmentIndex(localAngle);
      if (segIdx !== lastSegIdx){
        playTick();
        lastSegIdx = segIdx;
      }

      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        finishSpin(winnerIdx);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(winnerIdx){
    spinning = false;
    hubBtn.textContent = "SPIN";
    var winner = items[winnerIdx];
    playWinChime();
    spawnConfetti();

    var now = new Date();
    var hh = String(now.getHours()).padStart(2,"0");
    var mm = String(now.getMinutes()).padStart(2,"0");
    history.unshift({ text: winner.text, time: hh + ":" + mm });
    if (history.length > 20) history.pop();
    renderHistory();

    resultName.textContent = winner.text;
    resultBanner.hidden = false;
    pendingRemovalId = removeAfterWin ? winner.id : null;
    hint.textContent = "";
  }

  function hideBanner(skipRemoval){
    resultBanner.hidden = true;
    if (!skipRemoval && pendingRemovalId){
      items = items.filter(function(x){ return x.id !== pendingRemovalId; });
      pendingRemovalId = null;
      renderItems();
      drawWheel();
    }
    updateHint();
  }

  // ---------- Events ----------
  hubBtn.addEventListener("click", spin);

  spinAgainBtn.addEventListener("click", function(){
    hideBanner(false);
    setTimeout(spin, 50);
  });

  closeBannerBtn.addEventListener("click", function(){
    hideBanner(false);
  });

  addForm.addEventListener("submit", function(e){
    e.preventDefault();
    var val = addInput.value.trim();
    if (!val) return;
    items.push(makeItem(val));
    addInput.value = "";
    renderItems();
    drawWheel();
    updateHint();
    addInput.focus();
  });

  removeAfterWinCheckbox.addEventListener("change", function(){
    removeAfterWin = removeAfterWinCheckbox.checked;
  });

  clearHistoryBtn.addEventListener("click", function(){
    history = [];
    renderHistory();
  });

  muteBtn.addEventListener("click", function(){
    muted = !muted;
    muteBtn.setAttribute("aria-pressed", muted ? "true" : "false");
    muteBtn.textContent = muted ? "🔇 효과음" : "🔊 효과음";
  });

  resetBtn.addEventListener("click", function(){
    if (spinning) return;
    items = defaultItems();
    history = [];
    removeAfterWin = false;
    removeAfterWinCheckbox.checked = false;
    rotationDeg = 0;
    renderItems();
    renderHistory();
    hideBanner(true);
    drawWheel();
    updateHint();
  });

  // ---------- Init ----------
  renderItems();
  renderHistory();
  updateHint();
  requestAnimationFrame(resizeCanvas);
})();
</script>
</body>
</html>
