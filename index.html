<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo Index</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif;
    background:
      radial-gradient(1200px 800px at 15% 10%, #6db3f2 0%, transparent 55%),
      radial-gradient(1400px 900px at 85% 90%, #1b4f9c 0%, transparent 60%),
      linear-gradient(160deg, #2f7cd6 0%, #0e3a73 100%);
    min-height: 100%;
  }

  .desktop {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 24px 72px;
  }

  /* ---------- 창(window) ---------- */
  .window {
    width: 960px;
    max-width: 100%;
    height: 640px;
    max-height: 85vh;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 25px 70px rgba(0,0,0,.4);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: width .15s ease, height .15s ease, border-radius .15s ease;
  }
  .window.maximized {
    width: 100vw;
    height: calc(100vh - 48px);
    max-width: none;
    max-height: none;
    border-radius: 0;
  }
  .window.minimized { height: 40px !important; }
  .window.minimized .toolbar,
  .window.minimized .body-area,
  .window.minimized .status-bar { display: none; }
  .window.closed { display: none; }

  .titlebar {
    flex: 0 0 40px;
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    padding-left: 10px;
    user-select: none;
  }
  .tb-icon { font-size: 15px; margin-right: 8px; }
  .tb-title { font-size: 13px; color: #333; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb-controls { display: flex; height: 100%; }
  .tb-btn { width: 46px; height: 100%; border: none; background: transparent; font-size: 12px; color: #333; cursor: pointer; }
  .tb-btn:hover { background: #e9e9e9; }
  .tb-close:hover { background: #e81123; color: #fff; }

  /* ---------- 도구모음 / 주소표시줄 ---------- */
  .toolbar {
    flex: 0 0 44px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 8px;
    background: #f6f6f6;
    border-bottom: 1px solid #e1e1e1;
  }
  .tool-btn {
    width: 30px; height: 30px;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    color: #444;
    display: flex; align-items: center; justify-content: center;
  }
  .tool-btn:hover:not(:disabled) { background: #e9e9e9; border-color: #d5d5d5; }
  .tool-btn:disabled { color: #c4c4c4; cursor: default; }
  .nav-toggle { display: none; }
  .address-bar {
    flex: 1; height: 30px;
    background: #fff; border: 1px solid #d5d5d5; border-radius: 4px;
    display: flex; align-items: center; padding: 0 8px; gap: 3px;
    font-size: 12.5px; color: #333;
    overflow-x: auto; white-space: nowrap;
  }
  .address-bar::-webkit-scrollbar { display: none; }
  .crumb { cursor: pointer; padding: 2px 5px; border-radius: 3px; }
  .crumb:hover { background: #e9e9e9; }
  .crumb-sep { color: #9a9a9a; }
  .search-box { width: 180px; height: 30px; flex: 0 0 auto; }
  .search-box input {
    width: 100%; height: 100%; box-sizing: border-box;
    border: 1px solid #d5d5d5; border-radius: 4px; padding: 0 10px;
    font-size: 12.5px; outline: none;
  }
  .search-box input:focus { border-color: #0078d4; }

  /* ---------- 본문 (탐색창 + 내용창) ---------- */
  .body-area { flex: 1; display: flex; min-height: 0; position: relative; }

  .nav-pane {
    width: 220px; flex: 0 0 220px;
    background: #f6f6f6;
    border-right: 1px solid #e1e1e1;
    overflow-y: auto;
    padding: 6px 0;
    font-size: 13px;
  }
  .nav-root {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; margin: 0 4px 2px;
    cursor: pointer; font-weight: 600; color: #333;
    border-radius: 4px; border: 1px solid transparent;
  }
  .nav-root:hover { background: #ececec; }
  .nav-root.selected { background: #cce8ff; border-color: #99d1ff; }
  .tree-row {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 6px; margin: 0 4px;
    cursor: pointer; border-radius: 4px; color: #333;
    white-space: nowrap; border: 1px solid transparent;
  }
  .tree-row:hover { background: #ececec; }
  .tree-row.selected { background: #cce8ff; border-color: #99d1ff; }
  .tree-row.tree-loading { color: #999; font-style: italic; cursor: default; }
  .tree-row.tree-loading:hover { background: transparent; }
  .tree-arrow { width: 14px; flex: 0 0 14px; text-align: center; color: #666; font-size: 10px; }
  .tree-arrow.empty { visibility: hidden; }

  .content-pane { flex: 1; overflow-y: auto; padding: 14px; background: #fff; }
  .search-heading { font-size: 12.5px; color: #666; margin-bottom: 10px; }
  .grid { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
  .grid-item {
    width: 96px; padding: 8px 4px; text-align: center;
    border-radius: 4px; cursor: pointer; border: 1px solid transparent;
  }
  .grid-item.flat { width: 132px; }
  .grid-item:hover { background: #f0f6fc; border-color: #e1e1e1; }
  .grid-item.selected { background: #cce8ff; border-color: #99d1ff; }
  .grid-item .icon { margin: 0 auto 6px; display: flex; justify-content: center; }
  .grid-item .label { font-size: 12px; color: #222; word-break: break-word; line-height: 1.3; }
  .grid-item .sub { font-size: 10.5px; color: #8a8a8a; margin-top: 3px; word-break: break-all; line-height: 1.25; }
  .empty-msg, .status-msg { color: #888; font-size: 13px; padding: 18px 4px; }

  .status-bar {
    flex: 0 0 26px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px; background: #f0f0f0; border-top: 1px solid #e1e1e1;
    font-size: 12px; color: #555;
  }
  .status-bar a { color: #666; text-decoration: none; }
  .status-bar a:hover { text-decoration: underline; }

  /* ---------- 작업 표시줄 / 시작 메뉴 / 트레이 ---------- */
  .taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 48px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: rgba(250,250,250,.8); backdrop-filter: blur(18px);
    border-top: 1px solid rgba(255,255,255,.5);
    z-index: 10;
  }
  .start-btn, .taskbar-app {
    height: 38px; padding: 0 12px;
    display: flex; align-items: center; gap: 6px;
    border-radius: 6px; cursor: pointer; font-size: 13px; color: #222;
  }
  .start-btn { width: 38px; justify-content: center; padding: 0; font-size: 18px; color: #0078d4; }
  .start-btn:hover, .taskbar-app:hover { background: rgba(0,0,0,.07); }
  .taskbar-app.active { background: rgba(0,0,0,.09); border-bottom: 2px solid #0078d4; }
  .clock { position: absolute; right: 14px; font-size: 12px; color: #222; text-align: center; line-height: 1.3; user-select: none; }

  .tray-icons { display: flex; align-items: center; gap: 4px; }
  .tray-icon {
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: rgba(0,0,0,.05); font-size: 12px; font-weight: 600; color: #555;
  }
  .tray-icon:hover { background: rgba(0,0,0,.1); }
  .tray-icon img { width: 62%; height: 62%; object-fit: contain; }

  .start-menu {
    position: fixed; left: 8px; bottom: 58px; width: 260px;
    background: rgba(255,255,255,.92); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.6); border-radius: 10px;
    box-shadow: 0 14px 44px rgba(0,0,0,.35);
    padding: 14px; display: none; z-index: 20;
  }
  .start-menu.open { display: block; }
  .start-menu-user { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex: 0 0 44px;
    background: #0078d4; color: #fff; font-size: 17px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-info { min-width: 0; }
  .user-name { font-size: 14px; font-weight: 600; color: #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-caption { font-size: 11px; color: #888; margin-top: 1px; }
  .user-link { font-size: 12px; color: #0078d4; text-decoration: none; display: inline-block; margin-top: 4px; }
  .user-link:hover { text-decoration: underline; }

  .start-menu-divider { height: 1px; background: rgba(0,0,0,.08); margin: 12px 0; }
  .start-apps { display: flex; flex-direction: column; gap: 1px; max-height: 260px; overflow-y: auto; }
  .start-app-row {
    display: flex; align-items: center; gap: 9px; padding: 7px 8px;
    border-radius: 6px; cursor: pointer; font-size: 12.5px; color: #222;
  }
  .start-app-row:hover { background: rgba(0,0,0,.06); }
  .start-app-icon {
    width: 20px; height: 20px; flex: 0 0 20px; border-radius: 4px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #e8e8e8; font-size: 11px; font-weight: 600; color: #555;
  }
  .start-app-icon img { width: 100%; height: 100%; object-fit: cover; }
  .start-app-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .start-app-chevron { color: #999; font-size: 10px; }
  .start-submenu {
    position: fixed; min-width: 190px; max-width: 260px;
    background: rgba(255,255,255,.96); backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,.08); border-radius: 8px;
    box-shadow: 0 12px 34px rgba(0,0,0,.3);
    padding: 6px; z-index: 25; display: none;
  }
  .start-submenu.open { display: block; }

  /* ---------- 환경설정 창 ---------- */
  .settings-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.25);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .settings-overlay.open { display: flex; }
  .settings-panel {
    width: 380px; max-width: calc(100vw - 32px);
    background: rgba(250,250,250,.98); backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,.08); border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    overflow: hidden;
  }
  .settings-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid #e5e5e5; font-size: 13.5px; font-weight: 600; color: #222;
  }
  .settings-close { border: none; background: transparent; font-size: 14px; color: #555; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .settings-close:hover { background: #e9e9e9; }
  .settings-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .settings-row { display: flex; flex-direction: column; gap: 4px; }
  .settings-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #222; cursor: pointer; }
  .settings-check input { width: 15px; height: 15px; }
  .settings-hint { font-size: 11.5px; color: #888; margin-left: 23px; line-height: 1.4; }
  .settings-label { font-size: 13px; color: #222; }
  .settings-select { height: 30px; border: 1px solid #d5d5d5; border-radius: 4px; padding: 0 8px; font-size: 12.5px; background: #fff; }
  .settings-divider { height: 1px; background: rgba(0,0,0,.08); }
  .settings-button {
    height: 30px; border: 1px solid #d5b5b0; border-radius: 4px; padding: 0 12px;
    font-size: 12.5px; background: #fdf2f0; color: #a03c2e; cursor: pointer; align-self: flex-start;
  }
  .settings-button:hover { background: #fbe4e0; }

  /* ---------- 우클릭 커스텀 메뉴 ---------- */
  .ctx-menu {
    position: fixed; min-width: 170px;
    background: rgba(255,255,255,.97); backdrop-filter: blur(16px);
    border: 1px solid rgba(0,0,0,.08); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    padding: 4px; z-index: 40;
  }
  .ctx-item { padding: 7px 10px; font-size: 12.5px; color: #222; border-radius: 5px; cursor: pointer; }
  .ctx-item:hover { background: rgba(0,0,0,.06); }

  /* ---------- 토스트(알림) ---------- */
  .toast {
    position: fixed; right: 16px; bottom: 64px; max-width: 320px;
    background: rgba(35,35,38,.94); color: #fff; border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.5;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    display: flex; align-items: flex-start; gap: 8px;
    opacity: 0; pointer-events: none; transform: translateY(6px);
    transition: opacity .15s ease, transform .15s ease;
    z-index: 30;
  }
  .toast.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .toast.warn { background: rgba(150,100,20,.92); }
  .toast-msg { flex: 1; white-space: pre-line; word-break: break-word; }
  .toast-close { background: transparent; border: none; color: #fff; opacity: .7; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
  .toast-close:hover { opacity: 1; }

  @media (max-width: 720px) {
    .desktop { padding: 8px 8px 64px; }
    .window { height: 90vh; max-height: none; }
    .search-box { display: none; }
    .nav-toggle { display: flex; }
    .nav-pane {
      position: absolute; z-index: 5; top: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      transition: transform .15s ease;
      box-shadow: 2px 0 10px rgba(0,0,0,.15);
    }
    .nav-pane.open { transform: translateX(0); }
  }
</style>
</head>
<body>

<div class="desktop">
  <div class="window" id="win">
    <div class="titlebar" id="titlebar">
      <div class="tb-icon">📁</div>
      <div class="tb-title" id="winTitle">Repo Index</div>
      <div class="tb-controls">
        <button class="tb-btn" id="btnMin" title="최소화">&#x2013;</button>
        <button class="tb-btn" id="btnMax" title="최대화">&#x25A1;</button>
        <button class="tb-btn tb-close" id="btnClose" title="닫기">&#x2715;</button>
      </div>
    </div>

    <div class="toolbar">
      <button class="tool-btn nav-toggle" id="btnNavToggle" title="탐색창">&#9776;</button>
      <button class="tool-btn" id="btnBack" title="뒤로" disabled>&#8592;</button>
      <button class="tool-btn" id="btnForward" title="앞으로" disabled>&#8594;</button>
      <button class="tool-btn" id="btnUp" title="위로" disabled>&#8593;</button>
      <button class="tool-btn" id="btnRefresh" title="이 폴더 다시 읽기 + GitHub과 비교">&#8635;</button>
      <div class="address-bar" id="breadcrumb"></div>
      <div class="search-box"><input id="searchInput" placeholder="전체 검색" /></div>
    </div>

    <div class="body-area">
      <div class="nav-pane" id="navPane"></div>
      <div class="content-pane" id="contentPane">
        <div class="status-msg">불러오는 중...</div>
      </div>
    </div>

    <div class="status-bar">
      <span id="statusText"></span>
      <span id="repoLink"></span>
    </div>
  </div>
</div>

<div class="start-menu" id="startMenu">
  <div class="start-menu-user">
    <div class="avatar" id="startAvatar">👤</div>
    <div class="user-info">
      <div class="user-name" id="startUserName">-</div>
      <div class="user-caption">GitHub 계정</div>
      <a class="user-link" id="startUserLink" target="_blank" rel="noopener noreferrer">GitHub 프로필 열기 ↗</a>
    </div>
  </div>
  <div class="start-menu-divider"></div>
  <div class="start-apps" id="startApps"></div>
  <div class="start-menu-divider"></div>
  <div class="start-app-row" id="settingsMenuRow">
    <div class="start-app-icon">&#9881;</div>
    <span class="start-app-name">설정</span>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-titlebar">
      <span>환경설정</span>
      <button class="settings-close" id="settingsCloseBtn" title="닫기">&#x2715;</button>
    </div>
    <div class="settings-body">
      <div class="settings-row">
        <label class="settings-check"><input type="checkbox" id="setGithubLinks"> GitHub 바로가기 표시</label>
        <div class="settings-hint">우클릭 메뉴에 "Pages에서 보기 / 저장소에서 보기 / GitHub에서 다운로드"를 추가로 표시합니다.</div>
      </div>
      <div class="settings-divider"></div>
      <div class="settings-row">
        <span class="settings-label">파일 더블클릭 시 동작 (폴더 · html 파일 제외)</span>
        <select class="settings-select" id="setDoubleClick">
          <option value="open">열기</option>
          <option value="download">다운로드</option>
        </select>
      </div>
      <div class="settings-divider"></div>
      <div class="settings-row">
        <span class="settings-label">로컬 헬퍼(웹훅)</span>
        <button class="settings-button" id="setKillHelperBtn">웹훅 종료</button>
        <div class="settings-hint">실행 중인 로컬 헬퍼(localserver.ahk)를 끕니다. 트레이 아이콘이 없어서 마우스로는 끌 수 없으므로, 끄려면 이 버튼을 사용하세요. (8000~8020 전체 포트에 종료 요청을 보냅니다)</div>
      </div>
    </div>
  </div>
</div>

<div class="taskbar">
  <div class="start-btn" id="startBtn" title="시작">&#8862;</div>
  <div class="taskbar-app active" id="taskbarApp">📁 탐색기</div>
  <div class="tray-icons" id="trayIcons"></div>
  <div class="clock" id="clock"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 아이콘 ============ */
function folderIcon(size, blue) {
  const top = blue ? "#63B3FF" : "#FFCA5F";
  const bot = blue ? "#2E7BE0" : "#FFB13B";
  return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <path d="M3 8a2 2 0 0 1 2-2h6.17a2 2 0 0 1 1.41.59L14.83 9H27a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z" fill="${top}"/>
    <path d="M3 12h26v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V12z" fill="${bot}"/>
  </svg>`;
}
function fileIcon(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <path d="M8 2h11l7 7v19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#eef1f4" stroke="#c7ccd1" stroke-width="1"/>
    <path d="M19 2v6a1 1 0 0 0 1 1h6" fill="none" stroke="#c7ccd1" stroke-width="1"/>
  </svg>`;
}
function htmlFileIcon(size) {
  const badge = Math.round(size * 0.5);
  return `<span style="position:relative;display:inline-block;width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 2h11l7 7v19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#eaf2fd" stroke="#8fb8ea" stroke-width="1"/>
      <path d="M19 2v6a1 1 0 0 0 1 1h6" fill="none" stroke="#8fb8ea" stroke-width="1"/>
    </svg>
    <svg width="${badge}" height="${badge}" viewBox="0 0 16 16" style="position:absolute;right:-2px;bottom:-2px;">
      <circle cx="8" cy="8" r="7" fill="#2b7de9" stroke="#fff" stroke-width="1.4"/>
      <path d="M6 10L10 6M10 6H7M10 6V9" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>`;
}

/* ============ owner/repo 추출 (하드코딩 금지) ============ */
function getOwnerRepo() {
  const owner = location.hostname.split(".")[0] || "";
  const repo = location.pathname.split("/").filter(Boolean)[0] || "";
  return { owner, repo };
}

/* ============ GitHub 바로가기 (보기/다운로드/수정/삭제) ============
   이 페이지 자체는 정적 사이트라 파일을 직접 쓸 수 없다. 수정/삭제는 항상
   GitHub의 해당 파일 위치로 이동시키는 것으로 대신한다 (그마저도 환경설정에서
   기본은 꺼져 있음 - 색인과 저장소가 어긋날 수 있어서, 직접 git으로 지우고
   커밋하는 편이 더 안전하기 때문).
================================================================== */
let cachedDefaultBranch = null;
async function getDefaultBranchCached() {
  if (cachedDefaultBranch) return cachedDefaultBranch;
  const { owner, repo } = getOwnerRepo();
  if (!owner || !repo) return "main";
  try {
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    cachedDefaultBranch = data.default_branch || "main";
  } catch (e) {
    cachedDefaultBranch = "main"; // 조회 실패해도 링크 자체는 열리도록 합리적인 기본값으로 진행
  }
  return cachedDefaultBranch;
}
function githubItemPath(it) { return it.path.map(encodeURIComponent).join("/"); }
async function githubRawUrl(it) {
  const { owner, repo } = getOwnerRepo();
  const branch = await getDefaultBranchCached();
  return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${githubItemPath(it)}`;
}
// "저장소에서 보기" - GitHub 저장소 화면(blob 뷰어, 커밋 이력 등 GitHub UI 그대로)으로 이동
async function openInRepo(it) {
  const { owner, repo } = getOwnerRepo();
  const branch = await getDefaultBranchCached();
  window.open(`https://github.com/${owner}/${repo}/blob/${branch}/${githubItemPath(it)}`, "_blank", "noopener,noreferrer");
}
// "Pages에서 보기" - raw 파일 URL을 그대로 새 탭에 띄운다. 텍스트/이미지는 브라우저가 그대로 보여준다
// (다운로드가 아니라 "그 페이지 자체를 보는" 용도 - 강제 다운로드는 아래 downloadFromGithub가 담당).
async function viewOnPages(it) {
  const url = await githubRawUrl(it);
  window.open(url, "_blank", "noopener,noreferrer");
}
// "GitHub에서 다운로드" - 단순 링크 이동이 아니라 fetch로 받아서 blob으로 강제 저장한다.
// (raw.githubusercontent.com은 텍스트/이미지를 그냥 열어버리기 때문에, 링크 이동만으로는 다운로드가 안 됨)
async function downloadFromGithub(it) {
  const url = await githubRawUrl(it);
  showToast(`GitHub에서 다운로드 중: ${it.name}`);
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(String(res.status));
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objUrl;
    a.download = it.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 4000);
    showToast(`다운로드 완료: ${it.name}`);
  } catch (e) {
    showToast(`GitHub 다운로드 오류: ${e.message}`, { kind: "warn" });
  }
}

function isHtml(name) { return /\.html$/i.test(name); }
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ============ 색인 제외 규칙 (indexer.ahk가 이미 거르지만, html도 자체적으로 한번 더 거른다) ============
   - 이름에 "_NIH_"가 포함되면(대소문자 무관) 모든 위치에서 제외
   - "pages.json"은 모든 위치에서 제외
   - 루트에서는 .git / indexer.ahk / index.html / start.json / tray.json 도 추가로 제외
============================================================================================= */
function filterNames(names, pathArr) {
  const isRoot = pathArr.length === 0;
  const rootOnly = new Set([".git", "indexer.ahk", "index.html", "start.json", "tray.json"]);
  return names.filter(name => {
    if (/_NIH_/i.test(name)) return false;
    if (name === "pages.json") return false;
    if (isRoot && rootOnly.has(name)) return false;
    return true;
  });
}

/* ============ 로컬 스토리지 (폴더 캐시 + 마지막 경로 기억) ============
   - 폴더 하나를 읽을 때마다 로컬 스토리지에 계속 쌓인다 (무한 누적).
   - 새로고침 버튼을 누르면 "그 폴더"만 캐시를 비우고 다시 읽는다.
================================================================== */
function cacheKey(pathArr) { return `idx:${repoName}:dir:${pathArr.join("/")}`; }
function lastPathKey() { return `idx:${repoName}:lastpath`; }
function readCache(pathArr) {
  try {
    const raw = localStorage.getItem(cacheKey(pathArr));
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function writeCache(pathArr, entry) {
  try { localStorage.setItem(cacheKey(pathArr), JSON.stringify(entry)); } catch (e) { /* 용량 초과 등은 무시 */ }
}
function clearCache(pathArr) {
  try { localStorage.removeItem(cacheKey(pathArr)); } catch (e) {}
  dirCache.delete(pathArr.join("/"));
}

/* ============ 환경설정 (윈도우 설정창 스타일 + 로컬 스토리지) ============
   - 수정/삭제는 이 페이지에서 직접 할 수 없다(정적 사이트라 쓰기 권한이 없음).
     대신 GitHub의 해당 파일 위치로 이동시키는 것 뿐이며, 그마저도 기본은 꺼져 있다.
   - 수정/삭제 기능은 아예 없다: 이 페이지는 정적 사이트라 쓰기 권한이 없고, 색인과 실제
     저장소가 어긋날 위험도 있어서 굳이 제공하지 않는다. git으로 직접 고치고 커밋하는 편이 낫다.
================================================================== */
const DEFAULT_SETTINGS = {
  githubLinksEnabled: true,
  doubleClickAction: "open" // "open" | "download"
};
function settingsKey() { return `idx:${repoName}:settings`; }
function loadSettings() {
  let s = { ...DEFAULT_SETTINGS };
  try {
    const raw = localStorage.getItem(settingsKey());
    if (raw) s = { ...s, ...JSON.parse(raw) };
  } catch (e) { /* 무시 */ }
  if (s.doubleClickAction !== "download") s.doubleClickAction = "open";
  return s;
}
function saveSettings() {
  try { localStorage.setItem(settingsKey(), JSON.stringify(settings)); } catch (e) {}
}
let settings = { ...DEFAULT_SETTINGS };

function applySettingsToPanel() {
  els.setGithubLinks.checked = settings.githubLinksEnabled;
  els.setDoubleClick.value = settings.doubleClickAction;
}
function setupSettingsPanel() {

  els.settingsOverlay.onclick = (e) => { if (e.target === els.settingsOverlay) els.settingsOverlay.classList.remove("open"); };

  els.setGithubLinks.onchange = () => { settings.githubLinksEnabled = els.setGithubLinks.checked; saveSettings(); };
  els.setDoubleClick.onchange = () => {

  els.setKillHelperBtn.onclick = async () => {

async function loadJsonConfig(name) {
  try {
    const res = await fetch(name, { cache: "no-store" });
    if (!res.ok) return null;
    const data = await res.json();
    return Array.isArray(data.items) ? data.items : null;
  } catch (e) {
    return null; // 파일이 없거나 형식이 잘못돼도 조용히 무시 (선택 기능이므로)
  }
}
function makeAppIcon(item, className) {
  const wrap = document.createElement("div");
  wrap.className = className;
  if (item.icon) {
    const img = document.createElement("img");
    img.src = item.icon;
    img.alt = "";
    img.onerror = () => { wrap.innerHTML = ""; wrap.textContent = (item.name || "?").charAt(0).toUpperCase(); };
    wrap.appendChild(img);
  } else {
    wrap.textContent = (item.name || "?").charAt(0).toUpperCase();
  }
  return wrap;
}
function activateExternalItem(item) {
  if (!item || !item.url) return;
  if (item.popup) {
    const w = item.width || 900;
    const h = item.height || 640;
    const left = Math.round(((window.screen.width || 1280) - w) / 2);
    const top = Math.round(((window.screen.height || 800) - h) / 2);
    window.open(item.url, "_blank", `popup=yes,width=${w},height=${h},left=${left},top=${top}`);
  } else {
    window.open(item.url, item.newTab === false ? "_self" : "_blank", "noopener,noreferrer");
  }
}
function closeAllSubmenus() {
  openSubmenuEls.forEach(el => el.remove());
  openSubmenuEls = [];
}
function positionFloating(el, anchorRect) {
  document.body.appendChild(el);
  el.classList.add("open");
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = anchorRect.right + 4;
  if (left + w > window.innerWidth) left = anchorRect.left - w - 4;
  if (left < 4) left = 4;
  let top = anchorRect.top;
  if (top + h > window.innerHeight - 8) top = window.innerHeight - h - 8;
  if (top < 4) top = 4;
  el.style.left = left + "px";
  el.style.top = top + "px";
}
function openSubmenuFor(row, items) {
  // row를 포함하는(조상인) 서브메뉴는 유지하고, 나머지 가지만 정리한다
  openSubmenuEls = openSubmenuEls.filter(el => {
    if (el.contains(row)) return true;
    el.remove();
    return false;
  });
  const sub = document.createElement("div");
  sub.className = "start-submenu";
  renderAppList(items, sub);
  sub.addEventListener("click", ev => ev.stopPropagation());
  positionFloating(sub, row.getBoundingClientRect());
  openSubmenuEls.push(sub);
}
function renderAppList(items, container) {
  container.innerHTML = "";
  items.forEach(item => {
    const row = document.createElement("div");
    row.className = "start-app-row";
    row.appendChild(makeAppIcon(item, "start-app-icon"));
    const nameEl = document.createElement("span");
    nameEl.className = "start-app-name";
    nameEl.textContent = item.name || "(이름 없음)";
    row.appendChild(nameEl);

    const hasChildren = Array.isArray(item.items) && item.items.length > 0;
    if (hasChildren) {
      const chev = document.createElement("span");
      chev.className = "start-app-chevron";
      chev.textContent = "▸";
      row.appendChild(chev);
      row.onclick = (e) => { e.stopPropagation(); openSubmenuFor(row, item.items); };
    } else {
      row.onclick = (e) => {
        e.stopPropagation();
        activateExternalItem(item);
        closeAllSubmenus();
        els.startMenu.classList.remove("open");
      };
    }
    container.appendChild(row);
  });
}
function renderTrayIcons(items) {
  els.trayIcons.innerHTML = "";
  items.slice(0, MAX_TRAY_ICONS).forEach(item => {
    const btn = makeAppIcon(item, "tray-icon");
    btn.title = item.name || "";
    btn.onclick = () => activateExternalItem(item);
    els.trayIcons.appendChild(btn);
  });
}

function showToast(message, opts = {}) {
  clearTimeout(toastTimer);
  els.toast.innerHTML = "";
  const msgEl = document.createElement("div");
  msgEl.className = "toast-msg";
  msgEl.textContent = message;
  const closeBtn = document.createElement("button");
  closeBtn.className = "toast-close";
  closeBtn.textContent = "✕";
  closeBtn.onclick = () => els.toast.classList.remove("show");
  els.toast.appendChild(msgEl);
  els.toast.appendChild(closeBtn);
  els.toast.className = "toast show" + (opts.kind === "warn" ? " warn" : "");
  // 중요한 알림(opts.sticky)도 화면에 영원히 남지는 않게 한다 - 그냥 읽을 시간을 더 준다(6초).
  // 더 일찍 닫고 싶으면 닫기(✕) 버튼으로 언제든 닫을 수 있다.
  const duration = opts.sticky ? 6000 : 2500;
  toastTimer = setTimeout(() => els.toast.classList.remove("show"), duration);
}

function downloadEmbeddedHelper() {
  try {
    const binary = atob(LOCALSERVER_AHK_B64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "localserver.ahk";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { /* 브라우저가 blob 다운로드를 막는 극단적인 경우엔 그냥 넘어간다 */ }
}
function offerHelperDownload(actionLabel) {
  downloadEmbeddedHelper();
  showToast(`로컬 헬퍼(localserver.ahk)를 찾지 못해 대신 다운로드했습니다.\n실행한 뒤 "${actionLabel}"를 다시 눌러주세요.`, { kind: "warn", sticky: true });
}

function absoluteFileUrl(path) {
  const base = location.origin + location.pathname.replace(/[^/]*$/, "");
  return base + path.map(encodeURIComponent).join("/");
}
async function pingPort(port) {
  try {
    const res = await fetch(`http://127.0.0.1:${port}/ping`, { signal: AbortSignal.timeout(800) });
    if (!res.ok) return false;
    const text = await res.text();
    return text.trim() === HELPER_SIGNATURE;
  } catch (e) {
    return false;
  }
}
// 8000~8020을 전부 동시에 스캔해서(끝까지 기다림) 우리 서명으로 응답한 포트들을 오름차순으로 반환한다.
// 웹훅이 실수로 중복 실행됐을 수도 있으므로(예: 스크립트를 두 번 실행) "가장 먼저 응답한 포트"가 아니라
// "가장 낮은 포트 번호"를 정본으로 삼아야 하고, 중복 실행 여부도 판단해야 하므로 race가 아니라 전수 스캔한다.
async function scanAllHelperPorts() {
  const ports = [];
  for (let p = LOCAL_HELPER_PORT_MIN; p <= LOCAL_HELPER_PORT_MAX; p++) ports.push(p);
  const results = await Promise.all(ports.map(p => pingPort(p).then(ok => ok ? p : null)));
  return results.filter(p => p !== null).sort((a, b) => a - b);
}
// 기존 호출부(ensureHelperPort 등) 호환용: 전수 스캔해서 가장 낮은 포트(없으면 null)만 돌려준다.
async function scanForHelperPort() {
  const found = await scanAllHelperPorts();
  return found.length ? found[0] : null;
}
async function ensureHelperPort() {
  if (cachedHelperPort !== null && (await pingPort(cachedHelperPort))) return cachedHelperPort;
  cachedHelperPort = await scanForHelperPort();
  return cachedHelperPort;
}
// 특정 포트에 종료 요청을 보낸다 (응답이 오든 안 오든, 연결이 끊기든 상관없이 실패는 그냥 무시한다 -
// 어차피 목적은 "떠 있으면 끄기"이고, 이미 꺼져있었다면 애초에 에러가 나는 게 정상이다).
async function killHelperPort(port) {
  try {
    await fetch(`http://127.0.0.1:${port}/kill`, { signal: AbortSignal.timeout(800) });
  } catch (e) { /* 무시 - 응답 전에 프로세스가 죽거나(정상), 애초에 그 포트에 아무것도 없거나 */ }
}
// 환경설정의 "웹훅 종료" 버튼: 혹시 몇 개가 떠있는지 몰라도 되도록 범위 전체에 킬을 날린다.
async function killAllHelperPorts() {
  const ports = [];
  for (let p = LOCAL_HELPER_PORT_MIN; p <= LOCAL_HELPER_PORT_MAX; p++) ports.push(p);
  await Promise.allSettled(ports.map(p => killHelperPort(p)));
  cachedHelperPort = null;
}
// 페이지 로드시 호출: 실수로 localserver.ahk가 두 번 이상 실행됐을 수 있으므로(두 번째는 더 높은
// 포트를 잡음) 전수 스캔해서 하나보다 많이 발견되면 가장 낮은 포트만 남기고 나머지는 모두 끈다.
async function initHelperPortAndCollapseDuplicates() {
  const found = await scanAllHelperPorts();
  if (found.length === 0) { cachedHelperPort = null; return; }
  cachedHelperPort = found[0];
  if (found.length > 1) {
    const extras = found.slice(1);
    await Promise.allSettled(extras.map(p => killHelperPort(p)));
    showToast(`로컬 헬퍼가 여러 개 실행 중이어서(포트 ${found.join(", ")}) 가장 낮은 포트(${found[0]})만 남기고 정리했습니다.`);
  }
}
function sizeQueryParam(it) {
  return (it && it.size > 0) ? `&size=${encodeURIComponent(it.size)}` : "";
}
async function localHelperOpen(it) {
  const port = await ensureHelperPort();
  if (port === null) { offerHelperDownload("열기"); return; }
  const url = absoluteFileUrl(it.path);
  showToast(`여는 중: ${it.name}`);
  try {
    const res = await fetch(`http://127.0.0.1:${port}/open?url=${encodeURIComponent(url)}${sizeQueryParam(it)}`);
    if (!res.ok) throw new Error(String(res.status));
    showToast(`열었습니다: ${it.name}`);
  } catch (e) {
    showToast(`여는 중 오류: ${e.message}`, { kind: "warn" });
  }
}
async function localHelperDownload(it) {
  const port = await ensureHelperPort();
  if (port === null) { offerHelperDownload("다운로드"); return; }
  const url = absoluteFileUrl(it.path);
  showToast(`저장 위치를 선택하세요: ${it.name}`);
  try {
    const res = await fetch(`http://127.0.0.1:${port}/download?url=${encodeURIComponent(url)}${sizeQueryParam(it)}`);
    const text = await res.text();
    if (!res.ok) throw new Error(String(res.status));
    showToast(text.includes("CANCELLED") ? "다운로드가 취소되었습니다." : `다운로드 완료: ${it.name}`);
  } catch (e) {
    showToast(`다운로드 오류: ${e.message}`, { kind: "warn" });
  }
}

/* ============ 우클릭 커스텀 메뉴 (브라우저 기본 메뉴는 막는다) ============ */
let activeCtxMenu = null;
function closeContextMenu() {
  if (activeCtxMenu) { activeCtxMenu.remove(); activeCtxMenu = null; }
}
function showContextMenu(x, y, items) {
  closeContextMenu();
  if (!items.length) return;
  const menu = document.createElement("div");
  menu.className = "ctx-menu";
  items.forEach(it => {
    const row = document.createElement("div");
    row.className = "ctx-item";
    row.textContent = it.label;
    row.onclick = (e) => { e.stopPropagation(); closeContextMenu(); it.action(); };
    menu.appendChild(row);
  });
  document.body.appendChild(menu);
  const w = menu.offsetWidth, h = menu.offsetHeight;
  let left = x, top = y;
  if (left + w > window.innerWidth) left = window.innerWidth - w - 4;
  if (top + h > window.innerHeight) top = window.innerHeight - h - 4;
  menu.style.left = Math.max(4, left) + "px";
  menu.style.top = Math.max(4, top) + "px";
  activeCtxMenu = menu;
}
function buildFileMenuItems(it) {
  if (it.type === "folder") return [];
  const items = [];
  if (it.type === "html") items.push({ label: "새 탭에서 열기", action: () => activate(it) });
  // 열기/다운로드는 이 사이트에서는 항상 로컬 프로그램(webhook)을 통해서만 가능하므로
  // 굳이 "로컬 프로그램으로"라고 설명을 덧붙이지 않는다.
  items.push({ label: "열기", action: () => localHelperOpen(it) });
  items.push({ label: "다운로드", action: () => localHelperDownload(it) });
  if (settings.githubLinksEnabled) {
    items.push({ label: "Pages에서 보기", action: () => viewOnPages(it) });
    items.push({ label: "저장소에서 보기", action: () => openInRepo(it) });
    items.push({ label: "GitHub에서 다운로드", action: () => downloadFromGithub(it) });
  }
  return items;
}
// 기본 우클릭 메뉴가 우리 커스텀 메뉴와 같이 뜨는 걸 막기 위해 최대한 이중으로 막는다:
// capture 단계(가장 먼저 실행) + bubble 단계 + document.oncontextmenu까지 전부 false 처리.
function blockNativeContextMenu(e) { e.preventDefault(); return false; }
document.addEventListener("contextmenu", blockNativeContextMenu, true);
document.addEventListener("contextmenu", blockNativeContextMenu, false);
document.oncontextmenu = () => false;
document.addEventListener("click", closeContextMenu);
document.addEventListener("scroll", closeContextMenu, true);

/* ============ 폴더 데이터 로드 (꼬리에 꼬리를 무는 방식 + 로컬 캐시) ============ */
async function loadDir(pathArr) {
  const key = pathArr.join("/");
  if (dirCache.has(key)) return dirCache.get(key);

  const cached = readCache(pathArr);
  if (cached) { dirCache.set(key, cached); return cached; }

  const prefix = pathArr.map(encodeURIComponent).join("/");
  const url = (prefix ? prefix + "/" : "") + "pages.json";
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`${url} 로드 실패: ${res.status}`);
  const data = await res.json();
  const folders = filterNames(Array.isArray(data.folders) ? data.folders : [], pathArr)
    .sort((a, b) => a.localeCompare(b, "ko"));
  // indexer.ahk가 파일마다 {name, size} 객체로 저장한다(웹훅 다운로드에 크기가 필요해서).
  // 혹시 예전 방식(순수 문자열 배열)의 pages.json이 섞여 있어도 방어적으로 처리한다.
  const rawFiles = Array.isArray(data.files) ? data.files : [];
  const fileObjs = rawFiles.map(f => typeof f === "string" ? { name: f, size: 0 } : { name: String(f.name || ""), size: Number(f.size) || 0 });
  const keptNames = new Set(filterNames(fileObjs.map(f => f.name), pathArr));
  const files = fileObjs.filter(f => keptNames.has(f.name)).sort((a, b) => a.name.localeCompare(b.name, "ko"));
  const entry = { folders, files };
  dirCache.set(key, entry);
  writeCache(pathArr, entry);
  return entry;
}

/* ============ 경로 <-> 주소창 플래그먼트(#...) ============ */
function pathToHash(pathArr) { return pathArr.map(encodeURIComponent).join("/"); }
function hashToPath(hash) {
  const h = (hash || "").replace(/^#/, "");
  if (!h) return null;
  return h.split("/").filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch (e) { return s; } });
}
async function resolveInitialPath(pathArr) {
  let p = (pathArr || []).slice();
  while (p.length > 0) {
    try { await loadDir(p); return p; } catch (e) { p = p.slice(0, -1); }
  }
  return [];
}

/* ============ 탐색 (뒤로/앞으로/위로/새로고침) ============ */
async function navigate(path, record = true) {
  currentPath = path;
  selected = null;
  els.searchInput.value = "";
  if (record) {
    history = history.slice(0, historyIndex + 1);
    history.push(path);
    historyIndex = history.length - 1;
  }
  path.forEach((_, i) => expanded.add(path.slice(0, i + 1).join("/")));
  try { window.history.replaceState(null, "", "#" + pathToHash(path)); } catch (e) {}
  try { localStorage.setItem(lastPathKey(), JSON.stringify(path)); } catch (e) {}
  renderBreadcrumb();
  await renderContentPane();
  renderNavPane();
}
els.btnBack.onclick = () => { if (historyIndex > 0) { historyIndex--; navigate(history[historyIndex], false); } };
els.btnForward.onclick = () => { if (historyIndex < history.length - 1) { historyIndex++; navigate(history[historyIndex], false); } };
els.btnUp.onclick = () => { if (currentPath.length > 0) navigate(currentPath.slice(0, -1)); };

/* 새로고침 버튼: 페이지 새로고침이 아니라 "이 폴더" 캐시만 비우고 다시 읽기 + GitHub API로 일치 여부 확인 */
els.btnRefresh.onclick = async () => {
  const path = currentPath;
  clearCache(path);
  const [, ghResult] = await Promise.allSettled([
    renderContentPane(),
    fetchGithubListing(path)
  ]);
  renderNavPane();
  if (ghResult.status === "fulfilled") {
    compareWithIndex(path, ghResult.value);
  } else {
    showToast("GitHub 확인 실패: " + ghResult.reason.message, { kind: "warn" });
  }
};

async function fetchGithubListing(pathArr) {
  const { owner, repo } = getOwnerRepo();
  if (!owner || !repo) throw new Error("owner/repo를 알 수 없습니다.");
  const apiPath = pathArr.map(encodeURIComponent).join("/");
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${apiPath}`;
  const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });
  if (!res.ok) throw new Error(`GitHub API ${res.status}`);
  const data = await res.json();
  const names = Array.isArray(data) ? data.map(it => it.name) : [];
  return filterNames(names, pathArr);
}
function compareWithIndex(pathArr, ghNames) {
  const entry = dirCache.get(pathArr.join("/")) || { folders: [], files: [] };
  const indexNames = [...entry.folders, ...entry.files.map(f => f.name)];
  const ghSet = new Set(ghNames);
  const idxSet = new Set(indexNames);
  const missing = ghNames.filter(n => !idxSet.has(n));   // GitHub엔 있는데 색인엔 없음
  const stale = indexNames.filter(n => !ghSet.has(n));   // 색인엔 있는데 GitHub엔 없음
  if (missing.length === 0 && stale.length === 0) {
    showToast("GitHub과 일치합니다.");
    return;
  }
  const lines = [];
  if (missing.length) lines.push(`색인에 없는 항목(GitHub엔 있음): ${missing.join(", ")}`);
  if (stale.length) lines.push(`색인에만 있는 항목(GitHub엔 없음): ${stale.join(", ")}`);
  showToast(lines.join("\n"), { kind: "warn", sticky: true });
}

/* 폴더 열기 / html 파일 열기(호스팅된 페이지) / 일반 파일은 환경설정의 더블클릭 동작을 따른다 */
async function activate(it) {
  const { path, type } = it;
  if (type === "folder") {
    els.searchInput.value = "";
    await navigate(path);
    return;
  }
  if (type === "html") {
    const isIndex = path[path.length - 1].toLowerCase() === "index.html";
    let url;
    if (isIndex) {
      const dirPath = path.slice(0, -1);
      url = dirPath.length ? dirPath.map(encodeURIComponent).join("/") + "/" : "./";
    } else {
      url = path.map(encodeURIComponent).join("/");
    }
    window.open(url, "_blank", "noopener,noreferrer");
    return;
  }
  // 일반 파일: 환경설정에서 고른 더블클릭 동작을 따른다 (기본값은 "열기")
  if (settings.doubleClickAction === "download") {
    localHelperDownload(it);
  } else {
    localHelperOpen(it);
  }
}
function flashStatus(msg) {
  clearTimeout(statusFlashTimer);
  els.statusText.textContent = msg;
  statusFlashTimer = setTimeout(updateStatus, 1800);
}

/* ============ 탐색창(왼쪽) — 폴더만 표시, 펼칠 때마다 그 폴더의 pages.json을 읽음 ============ */
function renderNavPane() {
  els.navPane.innerHTML = "";
  const rootRow = document.createElement("div");
  rootRow.className = "nav-root" + (currentPath.length === 0 ? " selected" : "");
  rootRow.innerHTML = `${folderIcon(16, true)}<span>${escapeHtml(repoName || "루트")}</span>`;
  rootRow.onclick = () => { navigate([]); els.navPane.classList.remove("open"); };
  els.navPane.appendChild(rootRow);

  const rootEntry = dirCache.get("");
  if (rootEntry) els.navPane.appendChild(buildTreeDom(rootEntry.folders, []));
}
function buildTreeDom(folderNames, pathArr) {
  const wrap = document.createElement("div");
  folderNames.forEach(name => {
    const childPath = [...pathArr, name];
    const key = childPath.join("/");
    const isOpen = expanded.has(key);
    const cached = dirCache.get(key);

    const row = document.createElement("div");
    row.className = "tree-row" + (currentPath.join("/") === key ? " selected" : "");
    row.style.paddingLeft = (6 + pathArr.length * 16) + "px";

    const arrow = document.createElement("span");
    arrow.className = "tree-arrow";
    arrow.textContent = isOpen ? "▾" : "▸";
    arrow.onclick = async (e) => {
      e.stopPropagation();
      if (isOpen) {
        expanded.delete(key);
        renderNavPane();
        return;
      }
      expanded.add(key);
      renderNavPane();
      try { await loadDir(childPath); } catch (err) { /* 접힌 상태로 둔다 */ }
      renderNavPane();
    };
    row.appendChild(arrow);
    row.insertAdjacentHTML("beforeend", folderIcon(15, false));
    const label = document.createElement("span");
    label.textContent = name;
    row.appendChild(label);
    row.onclick = () => { expanded.add(key); navigate(childPath); els.navPane.classList.remove("open"); };
    wrap.appendChild(row);

    if (isOpen) {
      if (cached) {
        wrap.appendChild(buildTreeDom(cached.folders, childPath));
      } else {
        const loading = document.createElement("div");
        loading.className = "tree-row tree-loading";
        loading.style.paddingLeft = (6 + (pathArr.length + 1) * 16) + "px";
        loading.textContent = "불러오는 중...";
        wrap.appendChild(loading);
      }
    }
  });
  return wrap;
}

/* ============ 내용창(오른쪽) ============ */
async function renderContentPane() {
  currentHeading = null;
  els.contentPane.innerHTML = '<div class="status-msg">불러오는 중...</div>';
  let entry;
  try {
    entry = await loadDir(currentPath);
  } catch (err) {
    currentItems = [];
    els.contentPane.innerHTML = `<div class="empty-msg">폴더를 열지 못했습니다: ${escapeHtml(err.message)}</div>`;
    updateStatus();
    return;
  }
  currentItems = [
    ...entry.folders.map(name => ({ name, path: [...currentPath, name], type: "folder" })),
    ...entry.files.map(f => ({ name: f.name, size: f.size, path: [...currentPath, f.name], type: isHtml(f.name) ? "html" : "file" }))
  ];
  currentOpts = { emptyText: "이 폴더는 비어 있습니다." };
  paintContentPane();
  updateStatus();
}

function buildGrid(items, opts) {
  if (items.length === 0) {
    const div = document.createElement("div");
    div.className = "empty-msg";
    div.textContent = opts.emptyText || "이 폴더는 비어 있습니다.";
    return div;
  }
  const grid = document.createElement("div");
  grid.className = "grid";
  items.forEach(it => {
    const key = it.path.join("/");
    const cell = document.createElement("div");
    cell.className = "grid-item" + (opts.flat ? " flat" : "") + (selected && selected.path.join("/") === key ? " selected" : "");
    const icon = it.type === "folder" ? folderIcon(32, false) : it.type === "html" ? htmlFileIcon(32) : fileIcon(32);
    const subHtml = opts.flat ? `<div class="sub">${escapeHtml(it.path.slice(0, -1).join("/") || repoName)}</div>` : "";
    cell.innerHTML = `<div class="icon">${icon}</div><div class="label">${escapeHtml(it.name)}</div>${subHtml}`;
    cell.onclick = () => { selected = { path: it.path, name: it.name, type: it.type }; paintContentPane(); updateStatus(); };
    cell.ondblclick = () => activate(it);
    cell.oncontextmenu = (e) => {
      e.preventDefault();
      e.stopPropagation();
      selected = { path: it.path, name: it.name, type: it.type };
      paintContentPane();
      showContextMenu(e.clientX, e.clientY, buildFileMenuItems(it));
    };
    grid.appendChild(cell);
  });
  return grid;
}
function paintContentPane() {
  els.contentPane.innerHTML = "";
  if (currentHeading) {
    const h = document.createElement("div");
    h.className = "search-heading";
    h.textContent = currentHeading;
    els.contentPane.appendChild(h);
  }
  els.contentPane.appendChild(buildGrid(currentItems, currentOpts));
}

/* ============ 검색 — 모든 하위 pages.json을 끝까지 읽어서 전체에서 찾는다 ============ */
function ensureFullIndex() {
  if (!fullIndexPromise) fullIndexPromise = crawlAll([]);
  return fullIndexPromise;
}
async function crawlAll(pathArr) {
  const entry = await loadDir(pathArr);
  let results = [];
  entry.folders.forEach(name => results.push({ name, path: [...pathArr, name], type: "folder" }));
  entry.files.forEach(f => results.push({ name: f.name, size: f.size, path: [...pathArr, f.name], type: isHtml(f.name) ? "html" : "file" }));
  for (const name of entry.folders) {
    const sub = await crawlAll([...pathArr, name]);
    results = results.concat(sub);
  }
  return results;
}
let searchDebounce = null;
els.searchInput.addEventListener("input", () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(runSearch, 200);
});
async function runSearch() {
  const raw = els.searchInput.value.trim();
  const q = raw.toLowerCase();
  if (!q) { await renderContentPane(); return; }
  els.contentPane.innerHTML = '<div class="status-msg">검색 중... (전체 폴더를 읽는 중)</div>';
  let all;
  try {
    all = await ensureFullIndex();
  } catch (err) {
    els.contentPane.innerHTML = `<div class="empty-msg">검색 중 오류: ${escapeHtml(err.message)}</div>`;
    return;
  }
  if (els.searchInput.value.trim().toLowerCase() !== q) return; // 그 사이 검색어가 바뀌었으면 무시
  const matches = all.filter(it => it.name.toLowerCase().includes(q));
  currentItems = matches;
  currentOpts = { flat: true, emptyText: "일치하는 항목이 없습니다." };
  currentHeading = `"${raw}" 검색 결과 (${matches.length}개)`;
  selected = null;
  paintContentPane();
  updateStatus();
}

/* ============ 주소표시줄(브레드크럼) ============ */
function renderBreadcrumb() {
  els.breadcrumb.innerHTML = "";
  const rootCrumb = document.createElement("span");
  rootCrumb.className = "crumb";
  rootCrumb.textContent = repoName || "루트";
  rootCrumb.onclick = () => navigate([]);
  els.breadcrumb.appendChild(rootCrumb);

  currentPath.forEach((name, i) => {
    els.breadcrumb.insertAdjacentHTML("beforeend", `<span class="crumb-sep">›</span>`);
    const c = document.createElement("span");
    c.className = "crumb";
    c.textContent = name;
    const p = currentPath.slice(0, i + 1);
    c.onclick = () => navigate(p);
    els.breadcrumb.appendChild(c);
  });
}

/* ============ 상태표시줄 / 툴바 상태 ============ */
function updateStatus() {
  let text = `${currentItems.length}개 항목`;
  if (selected) text += `  |  선택됨: ${selected.name}`;
  els.statusText.textContent = text;

  els.btnBack.disabled = historyIndex <= 0;
  els.btnForward.disabled = historyIndex >= history.length - 1;
  els.btnUp.disabled = currentPath.length === 0;
}

/* ============ 시계 ============ */
function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const dateStr = now.toLocaleDateString("ko-KR", { month: "numeric", day: "numeric", weekday: "short" });
  els.clock.innerHTML = `${hh}:${mm}<br>${dateStr}`;
}
updateClock();
setInterval(updateClock, 15000);

/* ============ 메인 ============ */
async function main() {
  const { owner, repo } = getOwnerRepo();
  repoName = repo || "Repo Index";
  document.title = repoName;
  els.winTitle.textContent = repoName;
  if (owner && repo) {
    els.repoLink.innerHTML = `<a href="https://github.com/${owner}/${repo}" target="_blank" rel="noopener noreferrer">${owner}/${repo}</a>`;
  }
  settings = loadSettings();
  setupSettingsPanel();
  setupStartMenu(owner);
  renderNavPane();
  renderBreadcrumb();

  // 페이지 로드시 로컬 헬퍼가 켜져 있는지 조용히 한 번 확인해둔다 (다운로드 안내 등 아무것도 띄우지 않음 -
  // 그냥 나중에 열기/다운로드를 누를 때 바로 쓸 수 있도록 미리 캐싱만 해두는 것).
  // 동시에, 실수로 두 번 실행됐을 수 있는 중복 웹훅도 감지해서 가장 낮은 포트만 남기고 정리한다.
  initHelperPortAndCollapseDuplicates();

  window.addEventListener("hashchange", () => {
    const p = hashToPath(location.hash) || [];
    if (p.join("/") !== currentPath.join("/")) {
      resolveInitialPath(p).then(rp => navigate(rp, true));
    }
  });

  // start.json / tray.json은 있으면 반영, 없거나 잘못돼도 조용히 무시 (선택 기능)
  loadJsonConfig("start.json").then(items => { if (items) renderAppList(items, els.startApps); });
  loadJsonConfig("tray.json").then(items => { if (items) renderTrayIcons(items); });

  // 시작 경로: 주소창 플래그먼트 우선, 없으면 로컬 스토리지에 기억된 경로 사용
  let initialPath = hashToPath(location.hash);
  if (!initialPath) {
    try {
      const remembered = JSON.parse(localStorage.getItem(lastPathKey()) || "null");
      if (Array.isArray(remembered)) initialPath = remembered;
    } catch (e) { /* 무시 */ }
  }
  const resolved = await resolveInitialPath(initialPath || []);
  await navigate(resolved, true);
}

main();
</script>
